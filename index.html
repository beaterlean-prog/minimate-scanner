<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MiniMate Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#101828;font-family:Anuphan,system-ui,sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;background:#fff}.head{padding:16px 18px;border-bottom:1px solid #e7edf5;display:flex;justify-content:space-between;align-items:center}.brand strong{display:block;font-size:18px}.brand small{color:#667085}.close{border:0;background:#eef3f9;border-radius:12px;width:42px;height:42px;font-size:20px}.camera{background:#101828;padding:12px}.reader{position:relative;width:100%;height:150px;min-height:150px;border-radius:14px;overflow:hidden;background:#101828}.reader video{width:100%!important;height:150px!important;object-fit:cover!important}.scanline{position:absolute;left:18px;right:18px;top:50%;height:2px;transform:translateY(-50%);background:#ef4444;border-radius:999px;box-shadow:0 0 7px rgba(239,68,68,.75);z-index:20;pointer-events:none}.camera-switch{display:block;margin:8px auto 0;border:1px solid #344054;background:#fff;color:#101828;border-radius:10px;padding:7px 12px;font:600 12px Anuphan,system-ui,sans-serif}.camera-switch[hidden]{display:none}.status{padding:10px 14px;background:#fff4e8;color:#b54708;font-size:13px}.status.ok{background:#ecfdf3;color:#027a48}.status.err{background:#fef3f2;color:#b42318}.latest{padding:14px 18px;border-bottom:1px solid #e7edf5}.latest small{color:#667085}.latest strong{display:block;font-size:18px;margin-top:3px}.items{padding:8px 18px 110px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #eef2f6}.row small{display:block;color:#667085}.price{font-weight:700;white-space:nowrap}.empty{text-align:center;color:#98a2b3;padding:26px}.total{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dfe6ee;padding:12px 18px}.totalin{max-width:684px;margin:auto;display:flex;justify-content:space-between;align-items:end}.total small{color:#667085}.total b{font-size:26px}.qty{font-weight:600}.hint{font-size:12px;color:#667085;margin-top:3px}.non-sale .items{display:none}.non-sale .total{display:none}.non-sale .latest{min-height:130px}
.cartctl{display:flex;align-items:center;gap:7px}.cartctl button{width:34px;height:34px;border:1px solid #d0d5dd;background:#fff;border-radius:10px;font-size:20px}.cartctl b{min-width:20px;text-align:center}.items{padding:6px 12px 98px}.row{align-items:center;padding:9px 0}.total{padding:9px 10px}.totalin{max-width:700px;align-items:center;gap:9px}.paybtn{border:0;background:#101828;color:#fff;border-radius:12px;padding:11px 14px;font-weight:700}.paybtn:disabled{opacity:.4}.paypanel{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:50;display:grid;place-items:end center;padding:10px}.paypanel[hidden]{display:none}.paycard{width:min(100%,700px);background:#fff;border-radius:18px;padding:15px;max-height:92vh;overflow:auto}.payhead{display:flex;justify-content:space-between;align-items:center}.paytabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.paytabs button{padding:11px;border:1px solid #d0d5dd;background:#fff;border-radius:12px;font-weight:700}.paytabs button.active{background:#101828;color:#fff}.cashinput{width:100%;font:700 27px Anuphan,sans-serif;padding:9px 11px;border:1px solid #d0d5dd;border-radius:12px}.payactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.payactions button{padding:12px;border:0;border-radius:12px;font-weight:700}.cancelpay{background:#eef2f6}.confirmpay{background:#101828;color:#fff}.qrbox{display:flex;justify-content:center;margin:10px 0}.change{font-size:18px;font-weight:700;margin-top:7px}html,body{height:100%;overflow:hidden}body{overscroll-behavior:none}.app{height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden}.head,.camera,.status{flex:0 0 auto}.scan-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#fff}.scan-scroll .items{padding-bottom:18px}.total{position:static!important;left:auto!important;right:auto!important;bottom:auto!important;flex:0 0 auto;z-index:30}</style>
</head>
<body>
<div id="app" class="app">
  <div class="head"><div class="brand"><strong>MiniMate · Scanner</strong><small id="subtitle">สแกนสินค้าได้ต่อเนื่อง</small></div><button class="close" onclick="window.close()">×</button></div>
  <div class="camera"><div id="reader" class="reader"><div class="scanline" aria-hidden="true"></div></div><button id="switchCamera" type="button" class="camera-switch" hidden>📷 เปลี่ยนกล้อง</button></div>
  <div id="status" class="status">กำลังเปิดกล้อง...</div>
  <div class="scan-scroll"><div class="latest"><small>สแกนล่าสุด</small><strong id="latest">—</strong><div id="latestHint" class="hint">หันกล้องไปที่บาร์โค้ดสินค้า</div></div>
  <div id="items" class="items"><div class="empty">ยังไม่มีสินค้าในรายการ</div></div></div>
  <div class="total"><div class="totalin"><div><small>จำนวน</small><div id="qty" class="qty">0 ชิ้น</div></div><div style="text-align:right"><small>รวม</small><div><b id="total">฿0</b></div></div><button id="payBtn" class="paybtn" type="button" disabled>รับเงิน</button></div></div>
<div id="payPanel" class="paypanel" hidden><div class="paycard"><div class="payhead"><div><small>ยอดชำระ</small><div><b id="payAmount" style="font-size:28px">฿0</b></div></div><button class="close" type="button" id="payClose">×</button></div><div class="paytabs"><button id="payTransfer" class="active" type="button">PromptPay</button><button id="payCash" type="button">เงินสด</button></div><div id="transferBox"><div id="qrBox" class="qrbox"></div><div id="qrHint" class="hint" style="text-align:center">สแกน QR แล้วกดยืนยันการขาย</div></div><div id="cashBox" hidden><label>รับเงิน</label><input id="cashReceived" class="cashinput" type="number" inputmode="decimal" min="0"><div id="cashChange" class="change">เงินทอน ฿0</div></div><div class="payactions"><button id="payCancel" class="cancelpay" type="button">ยกเลิก</button><button id="payConfirm" class="confirmpay" type="button">ยืนยันการขาย</button></div></div></div>
</div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  const qs=new URLSearchParams(location.search),channel=qs.get('channel')||'',target=qs.get('target')||'trade',openerOrigin=qs.get('openerOrigin')||'';
  let scanner=null,lastCode='',lastSeen=0,audioCtx=null,cameras=[],cameraIndex=0,currentCart={items:[],qty:0,total:0,currency:'฿'},checkoutData=null,payMethod='TRANSFER';const HOLD=1800,CAMERA_KEY='minimate-scanner-camera-id';
  const app=document.getElementById('app');
  if(target!=='trade')app.classList.add('non-sale');
  document.getElementById('subtitle').textContent=target==='product-field'?'สแกนบาร์โค้ดเพื่อใส่ในสินค้า':target==='stock'?'สแกนเพื่อค้นหาสินค้าและสต๊อก':'สแกนสินค้าได้ต่อเนื่อง';
  function validOrigin_(){try{return /^https:\/\//i.test(openerOrigin)&&new URL(openerOrigin).origin===openerOrigin}catch(e){return false}}
  function post(type,data){if(!channel||!validOrigin_()||!window.opener)return;try{window.opener.postMessage(Object.assign({source:'minimate-camera',channel:channel,type:type},data||{}),openerOrigin)}catch(e){}}
  function money(n,c){return (c||'฿')+Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2})}
  function status(t,cls){const e=document.getElementById('status');e.textContent=t;e.className='status'+(cls?' '+cls:'')}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function renderCart(c){if(target!=='trade')return;c=c||{};currentCart=c;document.getElementById('qty').textContent=Number(c.qty||0).toLocaleString('th-TH')+' ชิ้น';document.getElementById('total').textContent=money(c.total,c.currency);const items=c.items||[],box=document.getElementById('items');box.innerHTML=items.length?items.map(x=>'<div class="row"><div><strong>'+esc(x.productName)+'</strong>'+(x.variant?'<small>'+esc(x.variant)+'</small>':'')+'<small>'+money(x.price,c.currency)+'</small></div><div class="cartctl"><button type="button" data-cart-code="'+esc(x.barcode)+'" data-delta="-1">−</button><b>'+Number(x.qty||0)+'</b><button type="button" data-cart-code="'+esc(x.barcode)+'" data-delta="1">+</button></div></div>').join(''):'<div class="empty">ยังไม่มีสินค้าในรายการ</div>';document.getElementById('payBtn').disabled=!Number(c.qty||0)}
  function beep(ok){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audioCtx)audioCtx=new C();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime+.01,count=ok?1:2;for(let i=0;i<count;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain(),at=now+(i*.14);o.type='sine';o.frequency.value=ok?980:620;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.07,at+.008);g.gain.exponentialRampToValueAtTime(.0001,at+.09);o.connect(g);g.connect(audioCtx.destination);o.start(at);o.stop(at+.1)}}catch(e){}try{if(navigator.vibrate)navigator.vibrate(ok?45:[45,70,45])}catch(e){}}
  function openPay(){if(!Number(currentCart.qty||0))return;status('กำลังเปิดรับเงิน...');post('checkout-request')}
  function showCheckout(d){checkoutData=d||{};const amount=Number(checkoutData.amount||0);document.getElementById('payAmount').textContent=money(amount,currentCart.currency);document.getElementById('cashReceived').value=amount;setPayMethod('TRANSFER');const q=document.getElementById('qrBox');q.innerHTML='';if(checkoutData.promptpayPayload&&window.QRCode)new QRCode(q,{text:checkoutData.promptpayPayload,width:190,height:190});document.getElementById('qrHint').textContent=checkoutData.promptpayReady?'สแกน QR แล้วกดยืนยันการขาย':'ยังไม่ได้ตั้งค่า PromptPay';document.getElementById('payPanel').hidden=false}
  function closePay(){document.getElementById('payPanel').hidden=true}
  function setPayMethod(m){payMethod=m==='CASH'?'CASH':'TRANSFER';document.getElementById('payTransfer').classList.toggle('active',payMethod==='TRANSFER');document.getElementById('payCash').classList.toggle('active',payMethod==='CASH');document.getElementById('transferBox').hidden=payMethod!=='TRANSFER';document.getElementById('cashBox').hidden=payMethod!=='CASH';updateChange()}
  function updateChange(){const a=Number(checkoutData&&checkoutData.amount||0),r=Number(document.getElementById('cashReceived').value||0);document.getElementById('cashChange').textContent='เงินทอน '+money(Math.max(0,r-a),currentCart.currency)}
  function confirmPay(){const a=Number(checkoutData&&checkoutData.amount||0),r=payMethod==='CASH'?Number(document.getElementById('cashReceived').value||0):a;if(payMethod==='CASH'&&r<a){status('ยอดเงินสดที่รับยังไม่ครบ','err');return}document.getElementById('payConfirm').disabled=true;post('sale-confirm',{method:payMethod,received:r})}
  function onDecoded(raw){const code=String(raw||'').trim().replace(/\s+/g,'');if(!code)return;const now=Date.now();if(code===lastCode&&(now-lastSeen)<HOLD){lastSeen=now;return}lastCode=code;lastSeen=now;document.getElementById('latest').textContent=code;document.getElementById('latestHint').textContent='กำลังตรวจสอบสินค้า...';post('scan',{code:code})}
    function cameraCandidates_(cams){const rear=(cams||[]).filter(c=>/back|rear|environment|หลัง|camera\s*[2-9]/i.test(c.label||''));return rear.length?rear:(cams||[])}
  function savedCameraIndex_(){try{const id=localStorage.getItem(CAMERA_KEY),i=cameras.findIndex(c=>c.id===id);return i>=0?i:0}catch(e){return 0}}
  function ensureScanline_(){if(!document.querySelector('#reader .scanline')){const line=document.createElement('div');line.className='scanline';line.setAttribute('aria-hidden','true');document.getElementById('reader').appendChild(line)}}
  async function startCamera_(index){if(!cameras.length)throw new Error('ไม่พบกล้องในอุปกรณ์นี้');cameraIndex=(index+cameras.length)%cameras.length;const cam=cameras[cameraIndex];if(scanner&&scanner.isScanning){try{await scanner.stop()}catch(e){}}document.getElementById('reader').innerHTML='';scanner=new Html5Qrcode('reader');await scanner.start(cam.id,{fps:12,qrbox:function(w,h){return {width:Math.max(190,Math.floor(w*.86)),height:Math.max(70,Math.min(92,Math.floor(h*.58)))}}},onDecoded,function(){});ensureScanline_();try{localStorage.setItem(CAMERA_KEY,cam.id)}catch(e){}const btn=document.getElementById('switchCamera');btn.hidden=cameras.length<2;btn.textContent='📷 เปลี่ยนกล้อง '+(cameraIndex+1)+'/'+cameras.length;status('พร้อมสแกน · กล้อง '+(cameraIndex+1)+'/'+cameras.length,'ok');post('ready')}
  async function switchCamera_(){const btn=document.getElementById('switchCamera');if(cameras.length<2)return;btn.disabled=true;status('กำลังเปลี่ยนกล้อง...');try{await startCamera_(cameraIndex+1)}catch(e){status('เปลี่ยนกล้องไม่สำเร็จ: '+(e&&e.message?e.message:String(e)),'err')}finally{btn.disabled=false}}
async function start(){
    if(!channel||!validOrigin_()||!window.opener){status('ลิงก์ Scanner ไม่สมบูรณ์ กรุณาเปิดจาก MiniMate','err');return}
    if(!window.isSecureContext){status('Scanner ต้องเปิดผ่าน HTTPS','err');return}
    if(!window.Html5Qrcode){status('โหลดระบบกล้องไม่สำเร็จ','err');return}
    try{
      const cams=await Html5Qrcode.getCameras();
      if(!cams||!cams.length)throw new Error('ไม่พบกล้องในอุปกรณ์นี้');
      cameras=cameraCandidates_(cams);
      cameraIndex=savedCameraIndex_();
      await startCamera_(cameraIndex);
    }catch(e){status('เปิดกล้องไม่สำเร็จ: '+(e&&e.message?e.message:String(e)),'err');post('error',{message:String(e&&e.message||e)})}
  }
  document.getElementById('switchCamera').addEventListener('click',switchCamera_);
  window.addEventListener('message',function(e){const d=e.data||{};if(e.source!==window.opener||e.origin!==openerOrigin||d.source!=='minimate-pos'||d.channel!==channel)return;if(d.type==='cart'){renderCart(d.cart);status('พร้อมสแกน','ok');}if(d.type==='command-ack'){if(d.command==='cart-change')status('อัปเดตรายการแล้ว','ok');}if(d.type==='checkout-data')showCheckout(d.checkout);if(d.type==='sale-processing')status('กำลังบันทึกการขาย...');if(d.type==='sale-success'){closePay();document.getElementById('payConfirm').disabled=false;renderCart(d.cart);status('ขายสำเร็จ'+(d.saleId?' · '+d.saleId:''),'ok');beep(true)}if(d.type==='sale-error'){document.getElementById('payConfirm').disabled=false;status(d.message||'บันทึกการขายไม่สำเร็จ','err');renderCart(d.cart);}if(d.type==='scan-result'){beep(!!d.ok);document.getElementById('latest').textContent=d.name||d.code||'—';document.getElementById('latestHint').textContent=d.ok?((target==='trade'?money(d.price,d.currency)+' · ':'')+(d.message||'สแกนสำเร็จ')):(d.message||'ไม่พบสินค้า');status(d.ok?'สแกนสำเร็จ':'สแกนไม่สำเร็จ',d.ok?'ok':'err');renderCart(d.cart)}});
  document.getElementById('items').addEventListener('click',function(e){const b=e.target.closest('button[data-cart-code]');if(b){status('กำลังอัปเดตรายการ...');post('cart-change',{code:b.dataset.cartCode,delta:Number(b.dataset.delta||0)})}});
  document.getElementById('payBtn').addEventListener('click',openPay);
  document.getElementById('payClose').addEventListener('click',closePay);
  document.getElementById('payCancel').addEventListener('click',closePay);
  document.getElementById('payTransfer').addEventListener('click',function(){setPayMethod('TRANSFER')});
  document.getElementById('payCash').addEventListener('click',function(){setPayMethod('CASH')});
  document.getElementById('cashReceived').addEventListener('input',updateChange);
  document.getElementById('payConfirm').addEventListener('click',confirmPay);
  window.addEventListener('beforeunload',function(){try{scanner&&scanner.isScanning&&scanner.stop()}catch(e){}post('closed')});
  post('loaded');start();
})();
</script>
</body>
</html>

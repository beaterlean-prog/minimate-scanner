<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MiniMate Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#101828;font-family:Anuphan,system-ui,sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;background:#fff}.head{padding:16px 18px;border-bottom:1px solid #e7edf5;display:flex;justify-content:space-between;align-items:center}.brand strong{display:block;font-size:18px}.brand small{color:#667085}.close{border:0;background:#eef3f9;border-radius:12px;width:42px;height:42px;font-size:20px}.camera{background:#101828;padding:12px}.reader{width:100%;min-height:270px;border-radius:16px;overflow:hidden;background:#101828}.status{padding:10px 14px;background:#fff4e8;color:#b54708;font-size:13px}.status.ok{background:#ecfdf3;color:#027a48}.status.err{background:#fef3f2;color:#b42318}.latest{padding:14px 18px;border-bottom:1px solid #e7edf5}.latest small{color:#667085}.latest strong{display:block;font-size:18px;margin-top:3px}.items{padding:8px 18px 110px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #eef2f6}.row small{display:block;color:#667085}.price{font-weight:700;white-space:nowrap}.empty{text-align:center;color:#98a2b3;padding:26px}.total{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dfe6ee;padding:12px 18px}.totalin{max-width:684px;margin:auto;display:flex;justify-content:space-between;align-items:end}.total small{color:#667085}.total b{font-size:26px}.qty{font-weight:600}.hint{font-size:12px;color:#667085;margin-top:3px}.non-sale .items{display:none}.non-sale .total{display:none}.non-sale .latest{min-height:130px}
</style>
</head>
<body>
<div id="app" class="app">
  <div class="head"><div class="brand"><strong>MiniMate · Scanner</strong><small id="subtitle">สแกนสินค้าได้ต่อเนื่อง</small></div><button class="close" onclick="window.close()">×</button></div>
  <div class="camera"><div id="reader" class="reader"></div></div>
  <div id="status" class="status">กำลังเปิดกล้อง...</div>
  <div class="latest"><small>สแกนล่าสุด</small><strong id="latest">—</strong><div id="latestHint" class="hint">หันกล้องไปที่บาร์โค้ดสินค้า</div></div>
  <div id="items" class="items"><div class="empty">ยังไม่มีสินค้าในรายการ</div></div>
  <div class="total"><div class="totalin"><div><small>จำนวน</small><div id="qty" class="qty">0 ชิ้น</div></div><div style="text-align:right"><small>รวม</small><div><b id="total">฿0</b></div></div></div></div>
</div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
  const qs=new URLSearchParams(location.search),channel=qs.get('channel')||'',target=qs.get('target')||'trade',openerOrigin=qs.get('openerOrigin')||'';
  let scanner=null,lastCode='',lastSeen=0,audioCtx=null;const HOLD=1800;
  const app=document.getElementById('app');
  if(target!=='trade')app.classList.add('non-sale');
  document.getElementById('subtitle').textContent=target==='product-field'?'สแกนบาร์โค้ดเพื่อใส่ในสินค้า':target==='stock'?'สแกนเพื่อค้นหาสินค้าและสต๊อก':'สแกนสินค้าได้ต่อเนื่อง';
  function validOrigin_(){try{return /^https:\/\//i.test(openerOrigin)&&new URL(openerOrigin).origin===openerOrigin}catch(e){return false}}
  function post(type,data){if(!channel||!validOrigin_()||!window.opener)return;try{window.opener.postMessage(Object.assign({source:'minimate-camera',channel:channel,type:type},data||{}),openerOrigin)}catch(e){}}
  function money(n,c){return (c||'฿')+Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2})}
  function status(t,cls){const e=document.getElementById('status');e.textContent=t;e.className='status'+(cls?' '+cls:'')}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function renderCart(c){if(target!=='trade')return;c=c||{};document.getElementById('qty').textContent=Number(c.qty||0).toLocaleString('th-TH')+' ชิ้น';document.getElementById('total').textContent=money(c.total,c.currency);const items=c.items||[],box=document.getElementById('items');box.innerHTML=items.length?items.map(x=>'<div class="row"><div><strong>'+esc(x.productName)+'</strong>'+(x.variant?'<small>'+esc(x.variant)+'</small>':'')+'</div><div class="price">x'+Number(x.qty||0)+' · '+money(Number(x.price||0)*Number(x.qty||0),c.currency)+'</div></div>').join(''):'<div class="empty">ยังไม่มีสินค้าในรายการ</div>'}
  function beep(ok){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audioCtx)audioCtx=new C();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime+.01,count=ok?1:2;for(let i=0;i<count;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain(),at=now+(i*.14);o.type='sine';o.frequency.value=ok?980:620;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.07,at+.008);g.gain.exponentialRampToValueAtTime(.0001,at+.09);o.connect(g);g.connect(audioCtx.destination);o.start(at);o.stop(at+.1)}}catch(e){}try{if(navigator.vibrate)navigator.vibrate(ok?45:[45,70,45])}catch(e){}}
  function onDecoded(raw){const code=String(raw||'').trim().replace(/\s+/g,'');if(!code)return;const now=Date.now();if(code===lastCode&&(now-lastSeen)<HOLD){lastSeen=now;return}lastCode=code;lastSeen=now;document.getElementById('latest').textContent=code;document.getElementById('latestHint').textContent='กำลังตรวจสอบสินค้า...';post('scan',{code:code})}
  async function start(){
    if(!channel||!validOrigin_()||!window.opener){status('ลิงก์ Scanner ไม่สมบูรณ์ กรุณาเปิดจาก MiniMate','err');return}
    if(!window.isSecureContext){status('Scanner ต้องเปิดผ่าน HTTPS','err');return}
    if(!window.Html5Qrcode){status('โหลดระบบกล้องไม่สำเร็จ','err');return}
    try{
      const cams=await Html5Qrcode.getCameras();
      if(!cams||!cams.length)throw new Error('ไม่พบกล้องในอุปกรณ์นี้');
      const preferred=cams.find(c=>/back|rear|environment|หลัง/i.test(c.label||''))||cams[cams.length-1];
      scanner=new Html5Qrcode('reader');
      await scanner.start(preferred.id,{fps:12,qrbox:function(w,h){return {width:Math.max(190,Math.floor(w*.78)),height:Math.max(100,Math.floor(h*.30))}}},onDecoded,function(){});
      status('พร้อมสแกน · นำบาร์โค้ดออกจากกรอบก่อนสแกนรหัสเดิมซ้ำ','ok');post('ready');
    }catch(e){status('เปิดกล้องไม่สำเร็จ: '+(e&&e.message?e.message:String(e)),'err');post('error',{message:String(e&&e.message||e)})}
  }
  window.addEventListener('message',function(e){const d=e.data||{};if(e.source!==window.opener||e.origin!==openerOrigin||d.source!=='minimate-pos'||d.channel!==channel)return;if(d.type==='cart')renderCart(d.cart);if(d.type==='scan-result'){beep(!!d.ok);document.getElementById('latest').textContent=d.name||d.code||'—';document.getElementById('latestHint').textContent=d.ok?((target==='trade'?money(d.price,d.currency)+' · ':'')+(d.message||'สแกนสำเร็จ')):(d.message||'ไม่พบสินค้า');status(d.ok?'สแกนสำเร็จ':'สแกนไม่สำเร็จ',d.ok?'ok':'err');renderCart(d.cart)}});
  window.addEventListener('beforeunload',function(){try{scanner&&scanner.isScanning&&scanner.stop()}catch(e){}post('closed')});
  post('loaded');start();
})();
</script>
</body>
</html>
